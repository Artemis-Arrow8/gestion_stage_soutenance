services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_MEDIA_ROOT: /app/media
    ports:
      - "${DJANGO_BIND_ADDRESS:-127.0.0.1}:${DJANGO_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  media-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "chown -R app:app /app/media"]
    restart: "no"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
