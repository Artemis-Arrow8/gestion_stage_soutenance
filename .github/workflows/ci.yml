name: CI - Gestion des stages et soutenances

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Vérification Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyser et tester Flutter
        run: |
          cd frontend
          flutter pub get
          flutter analyze
          flutter test

  verification:
    name: Vérification Django, tests et Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion_user -d gestion_stage_soutenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        env:
          DJANGO_SECRET_KEY: ci-only-jwt-signing-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py check

      - name: Exécuter les tests backend
        env:
          DJANGO_SECRET_KEY: ci-only-jwt-signing-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py test

      - name: Vérifier les migrations
        env:
          DJANGO_SECRET_KEY: ci-only-jwt-signing-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py makemigrations --check --dry-run

      - name: Construire l'image Docker
        run: docker build -t gestion-stage-soutenance:ci -f Dockerfile .
