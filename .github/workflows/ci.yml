name: CI - Gestion des stages et soutenances

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verification:
    name: Vérification Django et Docker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py check

      - name: Construire l'image Docker
        run: docker build -t gestion-stage-soutenance:ci -f Dockerfile .
