name: CI - Gestion des stages et soutenances

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Vérification Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true

      - name: Analyser et tester Flutter
        run: |
          cd frontend
          flutter pub get
          flutter analyze
          flutter test

  verification:
    name: Vérification Django, tests et Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestion_stage_soutenance
          # Ce compte privilégié ne sert qu'à créer la base de test éphémère en CI.
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-admin-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion_user -d gestion_stage_soutenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        env:
          DJANGO_SECRET_KEY: ci-only-jwt-signing-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-admin-password-not-for-production
          DB_USER: gestion_user
          DB_PASSWORD: ci-test-admin-password-not-for-production
          DB_ADMIN_USER: gestion_user
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py check

      - name: Exécuter les tests backend
        env:
          DJANGO_SECRET_KEY: ci-only-jwt-signing-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-admin-password-not-for-production
          DB_USER: gestion_user
          DB_PASSWORD: ci-test-admin-password-not-for-production
          DB_ADMIN_USER: gestion_user
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py test

      - name: Vérifier les migrations
        env:
          DJANGO_SECRET_KEY: ci-only-jwt-signing-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-admin-password-not-for-production
          DB_USER: gestion_user
          DB_PASSWORD: ci-test-admin-password-not-for-production
          DB_ADMIN_USER: gestion_user
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py makemigrations --check --dry-run

      - name: Vérifier l’isolation du rôle applicatif
        # Le compte admin CI est éphémère ; Django en production n’y accède jamais.
        env:
          POSTGRES_DB: gestion_stage_soutenance
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: ci-test-admin-password-not-for-production
          DB_USER: sgsus_app_user
          DB_PASSWORD: ci-test-app-password-not-for-production
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql --host localhost --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 --command \
            "CREATE TABLE public.role_init_fixture (id serial PRIMARY KEY)"
          psql --host localhost --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 --file ../database/provision-app-role.sql
          export PGPASSWORD="$DB_PASSWORD"
          attributes="$(psql --host localhost --username "$DB_USER" --dbname "$POSTGRES_DB" \
            --no-align --tuples-only --command \
            "SELECT rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolbypassrls, rolinherit, has_schema_privilege(current_user, 'public', 'CREATE') FROM pg_roles WHERE rolname = current_user")"
          test "$attributes" = "t|f|f|f|f|f|f|t"
          psql --host localhost --username "$DB_USER" --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 --command \
            "ALTER TABLE public.role_init_fixture ADD COLUMN role_can_migrate boolean"
          sequence_value="$(psql --host localhost --username "$DB_USER" --dbname "$POSTGRES_DB" \
            --no-align --tuples-only --command \
            "SELECT nextval('public.role_init_fixture_id_seq')")"
          test "$sequence_value" = "1"

      - name: Construire l'image Docker
        # Le contexte racine fournit aussi database/schema.sql au Dockerfile.
        working-directory: .
        run: docker build -t gestion-stage-soutenance:ci -f backend/Dockerfile .
