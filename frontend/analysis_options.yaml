# Ce fichier configure l'analyseur statique de Dart pour vérifier les erreurs, 
# les avertissements et les règles de style (lints) dans le projet Flutter[cite: 6].
# Documentation officielle : https://dart.dev/guides/language/analysis-options[cite: 6]

# Intègre l'ensemble des règles de bonnes pratiques recommandées pour les applications Flutter[cite: 6]
include: package:flutter_lints/flutter.yaml

analyzer:
  # Dossiers générés ou natifs à exclure de l'analyse statique pour optimiser les performances[cite: 6]
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # Les règles de linter appliquées à ce projet peuvent être personnalisées dans 
  # la section ci-dessous pour désactiver ou activer des règles spécifiques[cite: 6].
  # Une liste de tous les lints disponibles est publiée sur https://dart.dev/lints[cite: 6]
  rules:
    # avoid_print: false  # Décommenter pour désactiver la règle interdisant l'utilisation de print()
    # prefer_single_quotes: true  # Décommenter pour forcer l'utilisation des guillemets simples