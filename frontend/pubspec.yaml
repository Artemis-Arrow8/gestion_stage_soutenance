name: gestion_stage_soutenance
description: "Plateforme de gestion des stages et soutenances - SGSUS"
publish_to: 'none' # Empêche la publication accidentelle sur pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion des icônes iOS par défaut
  cupertino_icons: ^1.0.2

  # Gestion d'état globale de l'application
  provider: ^6.1.1

  # Stockage sécurisé des tokens JWT (accessToken / refreshToken)
  flutter_secure_storage: ^9.0.0

  # Stockage local simple de données légères
  shared_preferences: ^2.2.2

  # Requêtes HTTP vers l'API Django REST Framework
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting et bonnes pratiques de code Flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Définition des actifs (images, polices, etc.) si nécessaire
  # assets:
  #   - assets/images/