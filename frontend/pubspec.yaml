name: gestion_stage_soutenance
description: "Plateforme de gestion des stages et soutenances - SGSUS"
publish_to: 'none' # Empêche la publication accidentelle sur pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion des icônes iOS par défaut
  cupertino_icons: ^1.0.2

  # Gestion d'état globale de l'application
  provider: ^6.1.1

  # Stockage sécurisé des tokens JWT (accessToken / refreshToken)
  flutter_secure_storage: ^11.2.0

  # Stockage local simple de données légères
  shared_preferences: ^2.2.2

  # Requêtes HTTP vers l'API Django REST Framework
  http: ^1.2.0
  file_picker: 13.3.2
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.1.1

  # Linting et bonnes pratiques de code Flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Police Roboto embarquée (sous-ensemble latin : accents, « », €…).
  # L'application Web n'a ainsi plus besoin de la télécharger chez Google à
  # chaque ouverture : indispensable pour le mode hors ligne et la version
  # PC sans Internet. Licence Apache 2.0 : assets/fonts/LICENSE-Roboto.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  # Définition des actifs (images, polices, etc.) si nécessaire
  # assets:
  #   - assets/images/