# =============================================================================
# Serveur web de la VERSION PC de SGSUS (conteneur « frontend »,
# profil Docker Compose « pc », lancé par scripts/demarrer-pc.ps1).
#
# Un seul point d'entrée, http://localhost:8080 :
#   * /api/…  -> relayé à l'API Django (conteneur « backend ») ;
#   * le reste -> l'application Flutter compilée (frontend/build/web_pc).
# Le site et l'API partageant la même adresse, le navigateur n'a besoin
# d'aucune autorisation CORS, et un téléphone du même Wi-Fi peut utiliser
# l'application avec l'adresse IP du PC.
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers texte compressés : chargement plus rapide sur téléphone.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    # API Django, relayée au conteneur backend.
    location /api/ {
        proxy_pass http://backend:8000;
        # Nom d'hôte fixe : Django l'accepte (ALLOWED_HOSTS contient
        # localhost) quelle que soit l'adresse tapée (localhost ou IP du PC).
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Dépôt des rapports PDF : 10 Mo maximum côté Django (marge incluse).
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    # Page d'accueil et service worker : toujours revalidés, pour qu'une
    # nouvelle compilation soit prise en compte immédiatement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw_hors_ligne.js {
        add_header Cache-Control "no-cache";
    }

    # Application Flutter : toute adresse inconnue renvoie index.html
    # (la navigation entre écrans est gérée par l'application).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
