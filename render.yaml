# =============================================================================
# Blueprint Render du projet SGSUS.
#
# Architecture de production :
#   * Static Site  « gestion-stage-soutenance-frontend »  -> Flutter Web
#   * Web Service  « gestion-stage-soutenance »          -> API Django (Docker)
#   * PostgreSQL 17                                      -> base de données
#
# Le Web Service backend a été créé manuellement dans le tableau de bord
# Render ; il est décrit ci-dessous EN COMMENTAIRE à titre de référence, pour
# ne pas créer un second service lors d'une synchronisation du Blueprint.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Frontend Flutter Web, publié séparément de l'API Django.
  # ---------------------------------------------------------------------------
  - type: web
    name: gestion-stage-soutenance-frontend
    runtime: static
    # Télécharge Flutter (version épinglée) puis compile l'application Web.
    buildCommand: bash scripts/build-flutter-web.sh
    staticPublishPath: frontend/build/web
    envVars:
      # URL publique de l'API HTTP (jamais l'URL PostgreSQL), terminée par /api.
      - key: API_BASE_URL
        value: https://gestion-stage-soutenance.onrender.com/api
    # Toute route inconnue renvoie l'application (navigation côté client).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # En-têtes de sécurité appliqués à toutes les pages du site statique.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ---------------------------------------------------------------------------
  # Référence : configuration attendue du Web Service backend (Docker).
  # À reproduire dans le tableau de bord Render (Settings du service).
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: gestion-stage-soutenance
  #   runtime: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: .
  #   # Laisser « Docker Command » VIDE : backend/entrypoint.sh attend la base,
  #   # applique les migrations, lance collectstatic puis Gunicorn sur $PORT.
  #   healthCheckPath: /health/
  #   envVars:
  #     - key: DATABASE_URL          # URL INTERNE de la base PostgreSQL Render
  #       fromDatabase:
  #         name: gestion-stage-soutenance-db
  #         property: connectionString
  #     - key: DJANGO_SECRET_KEY       # ≥ 50 caractères (generateValue n'en
  #       sync: false                  # produit que 44 : saisir une clé générée)
  #     - key: DJANGO_DEBUG
  #       value: "False"
  #     - key: DJANGO_CORS_ALLOWED_ORIGINS   # URL exacte du Static Site ci-dessus
  #       value: https://gestion-stage-soutenance-frontend.onrender.com
  #     - key: DJANGO_SECURE_SSL_REDIRECT
  #       value: "True"
  #     - key: DJANGO_SECURE_COOKIES
  #       value: "True"
  #   # RENDER_EXTERNAL_HOSTNAME et RENDER sont injectés par Render : l'hôte
  #   # public est ajouté automatiquement à ALLOWED_HOSTS et le proxy HTTPS
  #   # est reconnu (aucune boucle de redirection).
